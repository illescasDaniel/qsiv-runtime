[project]
name = "qsiv-runtime"
version = "0.1.0"
description = "Local QSIV decision model for your tools: one shared GPU service, a stdlib-only client, setup and doctor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [
    { name = "Daniel Illescas Romero", email = "illescas.daniel@protonmail.com" }
]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/illescasDaniel/qsiv-runtime"
Issues = "https://github.com/illescasDaniel/qsiv-runtime/issues"

[project.scripts]
qsiv-runtime = "qsiv_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsiv_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "THIRD_PARTY.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "scripts/release_notes.py",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
